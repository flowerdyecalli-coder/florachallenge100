<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="영어, 쉐도잉, 음악을 위한 플로라 플레이리스트">
  <title>플로라 링크 플레이리스트</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f7f9f5;
  --white: #fff;
  --ink: #202e26;
  --muted: #526459;
  --green: #206149;
  --soft: #e9f2eb;
  --line: #dbe5db;
  --radius: 16px;
  font: 16px/1.45 system-ui, -apple-system, 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #edf2eb; }
body {
  margin: 0 auto;
  max-width: 760px;
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  overflow: hidden;
  padding: env(safe-area-inset-top) max(0px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0px, env(safe-area-inset-left));
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 0 45px #1835220b;
}
h1, h2, h3, p { margin: 0; }
button, select, input { font: inherit; }
button, select, .settings summary {
  min-height: 42px;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--white);
  color: var(--ink);
  cursor: pointer;
}
button:hover, .settings summary:hover { background: var(--soft); }
button:disabled { opacity: .52; cursor: default; }
:focus-visible { outline: 2px solid #387b61; outline-offset: 2px; }
.primary { background: var(--green); border-color: var(--green); color: white; }
.primary:hover:not(:disabled) { background: #194d3a; }
.topbar, .tabs { padding-inline: clamp(12px, 4vw, 24px); }
.topbar {
  min-height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
}
.brand { display: flex; align-items: center; gap: 10px; }
.flower {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--green);
  background: var(--soft);
  font-size: 25px;
}
.brand h1 { font-size: 1.25rem; line-height: 1.15; letter-spacing: -.045em; }
.brand h1 small { color: var(--muted); font-size: .75rem; font-weight: 500; letter-spacing: 0; margin-left: 3px; }
.brand p { color: var(--muted); font-size: .8125rem; margin-top: 2px; }
.settings { position: relative; z-index: 4; }
.settings summary { display: grid; place-items: center; list-style: none; font-size: .875rem; }
.settings summary::-webkit-details-marker { display: none; }
.settings-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 5px);
  min-width: max-content;
  display: grid;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  box-shadow: 0 6px 24px #18352220;
}
.settings-menu button { border: 0; text-align: left; font-size: .875rem; }
.tabs {
  min-width: 0;
  display: flex;
  align-items: stretch;
  background: white;
  border-bottom: 1px solid var(--line);
}
#groups {
  min-width: 0;
  display: flex;
  overflow-x: auto;
  scrollbar-width: thin;
}
#groups button, #addgroup {
  flex: none;
  min-height: 43px;
  border: 0;
  border-bottom: 3px solid transparent;
  border-radius: 0;
  white-space: nowrap;
}
#groups button { padding-inline: clamp(9px, 3vw, 17px); }
#groups button[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); font-weight: 750; }
#addgroup { font-size: 1.25rem; width: 41px; padding-inline: 4px; }
main {
  min-height: 0;
  min-width: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 10px;
  padding: 11px clamp(12px, 4vw, 24px) 8px;
}
.playercard {
  min-width: 0;
  flex-shrink:0;
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 3px 14px #19332208;
  overflow: hidden;
}
#stage { background: #18211c; }
#youtube { height: clamp(200px, 33dvh, 320px); }
#youtube iframe { display: block; border: 0; width: 100%; height: 100%; }
#media { display: block; width: 100%; max-height: min(29dvh, 280px); }
.now { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 2px 8px; padding: 9px 12px 1px; }
.now h2 { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status { color: var(--muted); font-size: .8125rem; grid-column: 1 / -1; overflow-wrap: anywhere; }
.badge { background: var(--soft); color: var(--green); border-radius: 20px; padding: 2px 7px; font-size: .75rem; white-space: nowrap; }
.seekrow { display: flex; align-items: center; gap: 9px; padding: 0 12px; }
#seek { min-width: 0; flex: 1; height: 32px; margin: 0; accent-color: var(--green); }
#clock { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }
.trimbox { margin: 0 10px 4px; padding: 0 7px 4px; border-radius: 9px; background: var(--soft); }
.trimsliders { position: relative; height: 38px; isolation: isolate; }
.trimrail { position: absolute; left: 12px; right: 12px; top: 16px; height: 6px; background: #cfddd1; border-radius: 10px; overflow: hidden; }
#trimFill { position: absolute; inset: 0; background: #74a88b; }
.trimsliders input {
  appearance: none;
  -webkit-appearance: none;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  background: transparent;
  pointer-events: none;
}
.trimsliders input::-webkit-slider-runnable-track { height: 6px; background: transparent; }
.trimsliders input::-moz-range-track { height: 6px; background: transparent; }
.trimsliders input::-webkit-slider-thumb {
  appearance: none;
  width: 24px;
  height: 32px;
  margin-top: -13px;
  border: 2px solid white;
  border-radius: 7px;
  background: var(--green);
  box-shadow: 0 1px 4px #18352255;
  pointer-events: auto;
  touch-action: none;
  cursor: ew-resize;
}
.trimsliders input::-moz-range-thumb {
  width: 20px;
  height: 28px;
  border: 2px solid white;
  border-radius: 7px;
  background: var(--green);
  pointer-events: auto;
  touch-action: none;
  cursor: ew-resize;
}
#trimEnd::-webkit-slider-thumb { background: #97532f; }
#trimEnd::-moz-range-thumb { background: #97532f; }
.trimsliders input:focus-visible { z-index: 2; }
.trimvalues { display: flex; justify-content: space-between; font-size: .8125rem; color: var(--muted); }
.trimvalues strong { margin-left: 2px; font-variant-numeric: tabular-nums; color: var(--ink); }
.transport {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 3px 10px 8px;
}
.transport-buttons { display: flex; gap: 4px; }
.transport button, .speed select { font-size: .875rem; }
#toggle { min-width: 68px; }
.speed { display: flex; align-items: center; gap: 4px; font-size: .875rem; color: var(--muted); }
.speed select { padding: 4px; }
.listsection { min-height: 0; min-width: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.sectionhead, .queuebar { display: flex; align-items: center; gap: 6px; }
.sectionhead { justify-content: space-between; }
.sectionhead h2 { font-size: 1.0625rem; }
.queuebar { padding: 2px 0 6px; }
.queuebar button, .sectionhead button { font-size: .875rem; }
.queuebar label { display: flex; align-items: center; min-height: 44px; margin-right: auto; font-size: .875rem; gap: 6px; }
.queuebar input, .track input { margin: 0; width: 19px; height: 19px; accent-color: var(--green); }
.add-track { background: var(--soft); color: var(--green); }
.list-scroll { min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.track {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 5px;
  margin-bottom: 6px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: white;
}
.track.selected { border-color: #88aa94; background: #f0f7f0; }
.trackcheck { position: relative; display: grid; place-items: center; width: 40px; height: 42px; }
.trackcheck input { cursor: pointer; }
.selection-order {
  position: absolute;
  top: 0;
  right: 1px;
  padding: 0 3px;
  border-radius: 4px;
  background: var(--soft);
  color: var(--green);
  font-size: .6875rem;
  pointer-events: none;
}
.track .play { display: grid; place-items: center; padding: 0; width: 38px; color: var(--green); background: var(--soft); }
.track h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9375rem; }
.track .meta { color: var(--muted); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tracktools { display: flex; gap: 2px; }
.tracktools button { font-size: .8125rem; padding: 4px 6px; border-color: transparent; }
.empty { padding: 18px 10px; border: 1px dashed #c5d6c9; border-radius: 11px; text-align: center; color: var(--muted); font-size: .875rem; }
#shadowPanel {
  margin-bottom: 7px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--soft);
}
#shadowPanel summary { padding: 9px 2px; cursor: pointer; color: var(--green); font-size: .875rem; }
.shadowcontrols { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .875rem; }
.shadowcontrols input { width: 55px; }
#recStatus { margin: 8px 0; color: var(--muted); font-size: .8125rem; }
.recording { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.recording audio { width: 230px; max-width: 100%; }
.recording a { color: var(--green); }
dialog { width: min(520px, 94vw); max-height: 90dvh; padding: 17px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); }
dialog::backdrop { background: #17382770; }
form > label { display: grid; gap: 4px; margin: 13px 0; font-size: .875rem; }
form input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px; }
.wide { width: 100%; }
.danger, .error { color: #98382e; }
.error:not(:empty) { margin-bottom: 8px; }
#toast {
  position: fixed;
  z-index: 5;
  inset: auto auto max(12px, env(safe-area-inset-bottom)) 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 92vw;
  border-radius: 8px;
  padding: 9px 13px;
  background: var(--ink);
  color: white;
  font-size: .875rem;
}
@media (max-height: 560px) {
  .topbar { min-height: 55px; }
  main { gap: 5px; padding-top: 5px; overflow-y: auto; grid-template-rows: auto minmax(130px, 1fr); }
}

main { grid-template-rows: max-content max-content minmax(150px,1fr); overflow: hidden; }
main:has(#trackDialog[hidden]) { grid-template-rows: max-content minmax(150px,1fr); }
#trackDialog { padding: 6px 10px; background:white; border:1px solid var(--line); border-radius:12px; }
#trackDialog form { display:grid; grid-template-columns:1fr auto; gap:5px; }
#trackDialog .sectionhead { grid-column:1/-1; }
#trackDialog form > label { margin:0; grid-column:1/-1; font-size:14px; }
#trackDialog input { padding:5px 8px; }
#trackDialog .error { grid-column:1/-1; }
#trackDialog button { min-height:34px; }
#showVideo { margin:4px 10px; font-size:14px; }
.track.selected { border:2px solid var(--green); background:#dcefe1; box-shadow:inset 4px 0 var(--green); }
#youtube { height:min(23dvh,200px); }
@media(max-width:480px) {
 .topbar { min-height:58px; } main { padding:6px 10px; gap:6px; }
 .transport { gap:3px; } .transport button { padding:4px 8px; }
 .speed select { max-width:90px; } #status { max-height:38px; overflow:auto; }
 #trackDialog form { grid-template-columns:1fr 1fr; }
 #trackDialog form > label { grid-column:auto; font-size:0; }
 #trackDialog form > label input { font-size:14px; }
 #trackDialog h2 { font-size:16px; }
 #trackDialog .wide { grid-column:1/-1; }
 body:has(#trackDialog:not([hidden])) #youtube { height:100px; }
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="flower" aria-hidden="true">✿</span>
      <div><h1>플로라 <small>V 0001.0005</small></h1><p>링크 플레이리스트</p></div>
    </div>
    <details class="settings">
      <summary>설정</summary>
      <div class="settings-menu">
        <button id="groupEdit">플레이리스트 설정</button>
        <button id="export">목록 내보내기</button>
        <button id="import">목록 가져오기</button>
        <input type="file" id="file" accept=".json" hidden>
      </div>
    </details>
  </header>
  <div class="tabs">
    <nav id="groups" role="tablist" aria-label="플레이리스트"></nav>
    <button id="addgroup" aria-label="플레이리스트 추가" title="플레이리스트 추가">＋</button>
  </div>
  <main>
    <section class="playercard" aria-label="재생기">
      <div id="stage" hidden>
        <div id="youtube" hidden><div id="yt"></div></div>
        <video id="media" preload="metadata" playsinline hidden></video>
      </div>
      <div class="now">
        <h2 id="nowTitle">재생할 곡을 선택해 주세요</h2>
        <span id="counter" class="badge" hidden></span>
        <p id="status" role="status" hidden></p>
      </div>
      <button id="showVideo" hidden>영상 재생</button>
      <div class="seekrow">
        <input id="seek" aria-label="재생 위치" type="range" min="0" max="100" step="0.1" value="0" disabled>
        <span id="clock">0:00 / 0:00</span>
      </div>
      <div class="trimbox" aria-label="반복 구간" hidden>
        <div class="trimsliders">
          <div class="trimrail"><div id="trimFill"></div></div>
          <input id="trimStart" type="range" min="0" max="100" step="0.1" value="0" aria-label="구간 시작점" disabled>
          <input id="trimEnd" type="range" min="0" max="100" step="0.1" value="100" aria-label="구간 종료점" disabled>
        </div>
        <div class="trimvalues"><span>시작 <strong id="trimStartText">0:00</strong></span><span>종료 <strong id="trimEndText">끝</strong></span></div>
      </div>
      <div class="transport">
        <div class="transport-buttons">
          <button id="prev" aria-label="이전 곡" disabled>이전</button>
          <button class="primary" id="toggle" disabled>재생</button>
          <button id="next" aria-label="다음 곡" disabled>다음</button>
        </div>
        <label class="speed">속도 <select id="liveRate" aria-label="재생 속도" disabled>
          <option value="0.5">0.5배</option><option value="0.75">0.75배</option><option value="1" selected>1배</option><option value="1.25">1.25배</option><option value="1.5">1.5배</option><option value="2">2배</option>
        </select></label>
      </div>
    </section>
  <section id="trackDialog" hidden aria-label="링크 입력">
    <form id="trackForm">
      <div class="sectionhead"><h2 id="dialogTitle">링크 추가</h2><button type="button" data-close="trackDialog">닫기</button></div>
      <label>제목<input name="title" required maxlength="150" placeholder="제목"></label>
      <label>유튜브 또는 오디오·영상 주소<input name="url" type="url" required placeholder="https://…"></label>
      <p class="error" id="formError" role="alert"></p>
      <button class="primary wide">저장하기</button>
    </form>
  </section>
    <section class="listsection" aria-label="재생 목록">
      <div class="sectionhead">
        <h2>재생 목록</h2>
        <button id="addTrack" class="add-track">＋ 링크 추가</button>
      </div>
      <div class="queuebar">
        <label><input type="checkbox" id="selectAll"> 전체 선택</label>
        <button id="queuePlay" class="primary" disabled>선택 재생</button>
        <button id="queueStop" hidden>목록 중지</button>
      </div>
      <div class="list-scroll">
        <details id="shadowPanel" hidden>
          <summary>쉐도잉 녹음</summary>
          <div class="shadowcontrols">
            <label>말할 시간 <input id="gap" type="number" min="1" max="120" value="5"> 초</label>
            <button id="shadowStart" class="primary">쉐도잉 시작</button>
            <button id="shadowStop">녹음·쉐도잉 중지</button>
            <button id="manualRec">직접 녹음</button>
          </div>
          <p id="recStatus" role="status">녹음은 이 기기에 저장됩니다.</p>
          <div id="recordings"></div>
        </details>
        <div id="tracks"></div>
      </div>
    </section>
  </main>
  <dialog id="groupDialog">
    <form id="groupForm">
      <div class="sectionhead"><h2>플레이리스트 설정</h2><button type="button" data-close="groupDialog">닫기</button></div>
      <label>이름<input name="name" required maxlength="60"></label>
      <label>사용 방식<select name="mode"><option value="video">영어</option><option value="shadow">쉐도잉·녹음</option><option value="music">음악·댄스</option></select></label>
      <div class="sectionhead"><button type="button" id="deleteGroup" class="danger">그룹 삭제</button><button class="primary">저장하기</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" hidden></div>
  <script>
'use strict';
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID(), KEY='flora-playlists-v1';
const initial=()=>({version:1,groups:[{id:uid(),name:'영어',mode:'video',tracks:[]},{id:uid(),name:'쉐도잉',mode:'shadow',tracks:[]},{id:uid(),name:'음악',mode:'music',tracks:[]},{id:uid(),name:'댄스곡',mode:'music',tracks:[]}]});
let data;try{data=validate(JSON.parse(localStorage.getItem(KEY)),true) }catch{data=initial()}
const playlistNames={'영어 공부':'영어','영어공부':'영어','쉐도잉 영어':'쉐도잉','쉐도잉영어':'쉐도잉','댄스':'댄스곡'};
for(const g of data.groups)g.name=playlistNames[g.name]||g.name;
let db;const req=indexedDB.open('flora-recordings',1);req.onupgradeneeded=()=>req.result.createObjectStore('recordings',{keyPath:'id'});req.onsuccess=()=>{db=req.result;renderRecordings()};req.onerror=()=>toast('녹음 저장소를 열지 못했어요. 다운로드로 보관해 주세요.');
function validate(v,preserve=false){if(!v||v.version!==1||!Array.isArray(v.groups)||!v.groups.length||v.groups.length>100)throw Error('목록 형식이 올바르지 않습니다.');return {version:1,groups:v.groups.map(g=>{if(!g||typeof g.name!=='string'||!g.name.trim()||!['video','shadow','music'].includes(g.mode)||!Array.isArray(g.tracks)||g.tracks.length>5000)throw Error('그룹 형식이 올바르지 않습니다.');return {id:preserve&&typeof g.id==='string'?g.id:uid(),name:g.name.slice(0,60),mode:g.mode,tracks:g.tracks.map(t=>{if(!t||typeof t.title!=='string'||!t.title.trim()||!safeUrl(t.url)||!Number.isFinite(t.start)||t.start<0||(t.end!==null&&(!Number.isFinite(t.end)||t.end<=t.start))||(!Number.isFinite(t.rate)||t.rate<.5||t.rate>2)||!Number.isInteger(t.repeat)||t.repeat<0||t.repeat>9999)throw Error('링크 설정이 올바르지 않습니다.');return {id:preserve&&typeof t.id==='string'?t.id:uid(),title:t.title.slice(0,150),url:t.url,start:t.start,end:t.end,rate:t.rate,repeat:t.repeat,note:String(t.note||'').slice(0,5000)}})}})}}
function safeUrl(s){try{return ['https:','http:'].includes(new URL(s).protocol)}catch{return false}}
function group(){return data.groups.find(g=>g.id===groupId)}function track(){return group()?.tracks.find(t=>t.id===currentId)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('저장 공간이 부족합니다. 목록을 내보내 보관해 주세요.')}}
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
function button(txt,fn,cls){const e=el('button',txt,cls);e.onclick=fn;return e}
function time(n){n=Math.max(0,Math.floor(n||0));return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
function ytId(url){try{const u=new URL(url);if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0];if(/(^|\.)youtube\.com$/.test(u.hostname)||u.hostname==='www.youtube-nocookie.com')return u.searchParams.get('v')||u.pathname.split('/').filter(Boolean)[1];}catch{}return null}

const media = $('media');
const settings = document.querySelector('.settings');
const rows = new Map();
const selected = new Set();
let groupId = data.groups[0].id;
let currentId = null;
let queue = null;
let run = null;
let player;
let ytReady = false;
let videoVisible = false;
let ytFailed = false;
let ytConnectTimer;
let toastTimer;
let editing = null;
let editingGroup = null;
let shadow = false;
let recorder = null;
let stream = null;
let recTimer = null;
let recording = false;
let trimEdit = null;
let seekEditing = false;

function toast(message) {
  clearTimeout(toastTimer);
  $('toast').textContent = message;
  $('toast').hidden = false;
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 3500);
}

function status(message = '') {
  $('status').textContent = message;
  $('status').hidden = !message;
}

function render() {
  const g = group();
  $('groups').replaceChildren(...data.groups.map(item => {
    const tab = button(item.name, () => switchGroup(item.id));
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', String(item.id === groupId));
    return tab;
  }));
  $('shadowPanel').hidden = g.mode !== 'shadow';
  $('tracks').replaceChildren();
  rows.clear();
  if (!g.tracks.length) {
    $('tracks').append(el('p', '저장된 링크가 없어요. 링크 추가로 시작해 주세요.', 'empty'));
  }
  for (const item of g.tracks) {
    const row = el('article', undefined, 'track');
    const checkLabel = el('label', undefined, 'trackcheck');
    const check = el('input');
    check.type = 'checkbox';
    check.setAttribute('aria-label', item.title + ' 선택');
    const order = el('span', undefined, 'selection-order');
    order.setAttribute('aria-hidden', 'true');
    check.onchange = () => {
      if (check.checked) selected.add(item.id);
      else selected.delete(item.id);
      syncSelection();
    };
    checkLabel.append(check, order);
    const playButton = button('▶', () => { if(selected.has(item.id)) startQueue([...selected]); else startTrack(item.id); }, 'play');
    playButton.setAttribute('aria-label', item.title + ' 재생');
    const info = el('div');
    const title = el('h3', item.title);
    title.title = item.note ? item.title + ' · ' + item.note : item.title;
    info.append(title, el('p', [trimTime(item.start) + ' ~ ' + (item.end === null ? '끝' : trimTime(item.end)), item.rate + '배속'].join(' · '), 'meta'));
    const tools = el('div', undefined, 'tracktools');
    tools.append(button('수정', () => openTrack(item)), button('삭제', () => removeTrack(item)));
    row.append(checkLabel, playButton, info, tools);
    $('tracks').append(row);
    rows.set(item.id, { row, check, order });
  }
  syncSelection();
  syncPlayer();
}

function removeTrack(item) {
  if (!confirm('이 링크를 삭제할까요?')) return;
  if (currentId === item.id) stopCurrent();
  group().tracks = group().tracks.filter(t => t.id !== item.id);
  selected.delete(item.id);
  save();
  render();
}

function syncSelection() {
  const all = $('selectAll');
  const size = group().tracks.length;
  all.checked = size > 0 && selected.size === size;
  all.indeterminate = selected.size > 0 && selected.size < size;
  all.disabled = size === 0;
  $('queuePlay').disabled = selected.size === 0;
  for (const { check, order } of rows.values()) {
    check.checked = false;
    order.hidden = true;
  }
  if (!selected.size) return;
  let number = 0;
  for (const id of selected) {
    const { check, order } = rows.get(id);
    check.checked = true;
    order.textContent = String(++number);
    order.hidden = selected.size < 2;
  }
}

function switchGroup(id) {
  if (id === groupId) return;
  stopCurrent();
  groupId = id;
  selected.clear();
  $('shadowPanel').open = false;
  document.querySelector('.list-scroll').scrollTop = 0;
  render();
  renderRecordings();
}

function stepTarget(direction) {
  const items = queue ? queue.ids : group().tracks.map(item => item.id);
  const index = queue ? queue.index : items.indexOf(currentId);
  const start = index === -1 && direction === -1 ? items.length : index;
  for (let next = start + direction; next >= 0 && next < items.length; next += direction) {
    if (rows.has(items[next])) return { id: items[next], index: next };
  }
  return null;
}

function syncPlayer() {
  for (const [id, { row }] of rows) { row.classList.toggle('selected', id === currentId); if(id===currentId) row.setAttribute('aria-current','true'); else row.removeAttribute('aria-current'); }
  const item = track();
  $('prev').disabled = !stepTarget(-1);
  $('next').disabled = !stepTarget(1);
  $('toggle').disabled = !item;
  $('liveRate').disabled = !item;
  if (item) {
    updateRates();
    $('nowTitle').textContent = item.title;
    $('nowTitle').title = item.title;
  } else {
    $('nowTitle').textContent = '재생할 곡을 선택해 주세요';
    $('nowTitle').removeAttribute('title');
  }
  $('queueStop').hidden = !queue || queue.complete;
  $('counter').hidden = !item;
  if (item) {
    $('counter').textContent = queue
      ? '선택 ' + (queue.index + 1) + ' / ' + queue.ids.length
      : run.round + ' / ' + (item.repeat || '∞') + '회';
  }
  updateStage();
  updateTimeline();
  revealCurrent();
}

function revealCurrent() {
  requestAnimationFrame(()=>{ const row=rows.get(currentId)?.row, list=document.querySelector('.list-scroll'); if(!row)return; const a=row.getBoundingClientRect(), b=list.getBoundingClientRect(); if(a.top<b.top || a.bottom>b.bottom) list.scrollTop += a.top-b.top; });
}

function updateStage() {
  $('showVideo').hidden = run?.kind !== 'yt';
  $('showVideo').textContent = videoVisible ? '영상 접기' : '영상 재생';
  $('youtube').hidden = run?.kind !== 'yt' || !videoVisible;
  media.hidden = run?.kind !== 'media' || !media.videoWidth || group().mode === 'music';
  $('stage').hidden = $('youtube').hidden && media.hidden;
}

function setPlaying(playing) {
  $('toggle').textContent = playing ? '일시정지' : '재생';
  if(playing && !trimEdit) status('재생 중');
}

function pause() {
  if (!run) return;
  run.wantsPlay = false;
  if (run.kind === 'yt' && ytReady) player.pauseVideo();
  if (run.kind === 'media') media.pause();
  setPlaying(false);
}

function resetMedia() {
  if (!media.hasAttribute('src')) return;
  media.removeAttribute('src');
  media.load();
}

function stopCurrent() {
  stopShadow();
  pause();
  clearTimeout(ytConnectTimer);
  run = null;
  currentId = null;
  queue = null;
  trimEdit = null;
  seekEditing = false;
  resetMedia();
  setPlaying(false);
  status();
}

function isPlaying() {
  if (run?.kind === 'yt') return youtubeMatches(run) && player.getPlayerState() === 1;
  return run?.kind === 'media' && !media.paused && !media.ended;
}

function position() {
  if (run?.kind === 'yt') return youtubeMatches(run) ? player.getCurrentTime() || 0 : 0;
  return run?.kind === 'media' && media.readyState >= 1 ? media.currentTime : 0;
}

function duration() {
  const length = run?.kind === 'yt' && youtubeMatches(run) ? player.getDuration()
    : run?.kind === 'media' && media.readyState >= 1 ? media.duration : 0;
  return Number.isFinite(length) && length > 0 ? length : 0;
}

function seek(target) {
  if (run?.kind === 'yt' && youtubeMatches(run)) {
    run.seekTarget = target;
    player.seekTo(target, true);
  } else if (run?.kind === 'media' && media.readyState >= 1) {
    media.currentTime = target;
  }
}

function resume() {
  const active = run;
  if (!active) return;
  active.wantsPlay = true;
  if (active.kind === 'yt') {
    if (!ytReady) {
      if (ytFailed) return failTrack(active, '유튜브에 연결할 수 없어요.');
      watchYouTube(active);
      return;
    }
    if (active.requested) {
      player.playVideo();
      watchYouTube(active);
    } else loadYouTube(active);
    return;
  }
  media.play().catch(error => {
    if (run !== active || !active.wantsPlay) return;
    if (error.name === 'NotAllowedError') {
      active.wantsPlay = false;
      setPlaying(false);
      status('브라우저가 자동 재생을 막았어요. 재생 버튼을 눌러 이어서 들을 수 있어요.');
    } else if (error.name !== 'AbortError') {
      failTrack(active, '재생할 수 없는 주소입니다. 오디오·영상 주소를 확인해 주세요.');
    }
  });
}

function startTrack(id, fromQueue = false) {
  const item = group().tracks.find(t => t.id === id);
  if (!item) return;
  if (!fromQueue) {
    queue = null;
    stopShadow();
  }
  pause();
  clearTimeout(ytConnectTimer);
  currentId = id;
  videoVisible = group().mode !== 'music';
  trimEdit = null;
  seekEditing = false;
  const videoId = ytId(item.url);
  const active = {
    kind: videoId ? 'yt' : 'media',
    videoId,
    wantsPlay: true,
    started: false,
    round: 1,
    requested: false,
    complete: false,
    failed: false,
    seekTarget: null
  };
  run = active;
  status('재생 준비 중');
  setPlaying(false);
  if (videoId) resetMedia();
  else {
    media.src = item.url;
    media.load();
  }
  syncPlayer();
  if (videoId && !/^[\w-]{11}$/.test(videoId)) {
    failTrack(active, '유튜브 영상 주소를 확인해 주세요.');
    return;
  }
  if (videoId && !ytReady && !ytFailed) connectYouTube();
  resume();
}

function youtubeMatches(active) {
  return ytReady && active?.kind === 'yt' && active.requested
    && player.getVideoData()?.video_id === active.videoId;
}

function watchYouTube(active) {
  clearTimeout(ytConnectTimer);
  ytConnectTimer = setTimeout(() => {
    if (run !== active || !active.wantsPlay) return;
    if (!ytReady) {
      failTrack(active, '유튜브 연결이 지연되고 있어요. 인터넷 연결을 확인해 주세요.');
    } else if (!isPlaying()) {
      status('유튜브 영상이 아직 시작되지 않았어요. 재생 버튼을 다시 눌러 주세요.');
    }
  }, ytReady ? 16000 : 10000);
}

function connectYouTube() {
  if ($('youtubeApi')) return;
  const script = el('script');
  script.id = 'youtubeApi';
  script.src = 'https://www.youtube.com/iframe_api';
  script.onerror = () => {
    ytFailed = true;
    clearTimeout(ytConnectTimer);
    if (run?.kind === 'yt' && run.wantsPlay) failTrack(run, '유튜브에 연결할 수 없어요.');
  };
  document.head.append(script);
}

function loadYouTube(active) {
  if (run !== active || !ytReady || !active.wantsPlay) return;
  active.requested = true;
  player.loadVideoById({ videoId: active.videoId, startSeconds: track().start });
  watchYouTube(active);
}

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    playerVars: { playsinline: 1, origin: location.origin },
    events: {
      onReady: () => {
        ytReady = true;
        clearTimeout(ytConnectTimer);
        if (run?.kind === 'yt') loadYouTube(run);
      },
      onStateChange: ({ data: state }) => {
        const active = run;
        if (state === 1 && active?.kind !== 'yt') {
          player.pauseVideo();
          return;
        }
        if (!youtubeMatches(active) || player.getPlayerState() !== state) return;
        if (state === 1) {
          if (active.complete || active.failed || trimEdit || recording) return;
          clearTimeout(ytConnectTimer);
          active.wantsPlay = true;
          active.started = true;
          status();
          setPlaying(true);
          updateRates();
          applyRate();
        } else if (state === 2) {
          setPlaying(false);
        } else if (state === 0) {
          onBoundary(active);
        }
      },
      onError: () => {
        if (run?.kind === 'yt' && run.requested && run.wantsPlay) {
          const reportedId = player.getVideoData()?.video_id;
          if (!reportedId || reportedId === run.videoId) {
            failTrack(run, '이 유튜브 영상은 여기에서 재생할 수 없어요.');
          }
        }
      },
      onAutoplayBlocked: () => {
        if (run?.kind !== 'yt' || !run.requested || !run.wantsPlay || isPlaying()) return;
        clearTimeout(ytConnectTimer);
        setPlaying(false);
        status('유튜브 자동 재생이 차단됐어요. 영상 또는 아래 재생 버튼을 눌러 주세요.');
      }
    }
  });
};

$('showVideo').onclick = () => { videoVisible = !videoVisible; updateStage(); updateRates(); };
function updateRates() {
  const item=track(); if(!item)return;
  const rates=run?.kind==='yt' && youtubeMatches(run) ? player.getAvailablePlaybackRates() : Array.from({length:31},(_,i)=>Number((.5+i*.05).toFixed(2)));
  const supported=rates.length ? rates : [1];
  $('liveRate').replaceChildren(...supported.map(rate=>{const o=el('option',rate.toFixed(2)+'배');o.value=String(rate);return o;}));
  $('liveRate').value=String(supported.includes(item.rate)?item.rate:1);
}
function applyRate() {
  const item = track();
  if (!item) return;
  if (run?.kind === 'media') {
    media.playbackRate = item.rate;
  } else if (youtubeMatches(run)) {
    const rates = player.getAvailablePlaybackRates();
    if (rates.includes(item.rate)) player.setPlaybackRate(item.rate);
    else if (rates.length > 0) {
      player.setPlaybackRate(1);
      status('이 유튜브 영상은 지원하는 배속만 선택할 수 있어요.');
    }
  }
}

function currentMedia(active) {
  return run === active && active?.kind === 'media' && media.currentSrc === media.src;
}

media.addEventListener('loadedmetadata', () => {
  const active = run;
  if (!currentMedia(active)) return;
  const item = track();
  if (duration() > 0 && item.start >= duration()) {
    failTrack(active, '저장된 시작점이 영상 길이를 벗어났어요. 링크나 구간을 수정해 주세요.');
    return;
  }
  if (item.start > 0) seek(item.start);
  applyRate();
  updateStage();
  updateTimeline();
});
media.addEventListener('playing', () => {
  if (!currentMedia(run) || !run.wantsPlay || run.failed || run.complete) return;
  run.started = true;
  status();
  setPlaying(true);
});
media.addEventListener('pause', () => {
  if (run?.kind === 'media' && media.paused) setPlaying(false);
});
media.addEventListener('ended', () => {
  if (currentMedia(run) && media.ended) onBoundary(run);
});
media.addEventListener('error', () => {
  if (run?.kind === 'media' && media.error) {
    failTrack(run, '재생할 수 없는 주소입니다. 오디오·영상 주소를 확인해 주세요.');
  }
});

function failTrack(active, message) {
  if (run !== active || active.failed) return;
  clearTimeout(ytConnectTimer);
  active.failed = true;
  pause();
  stopShadow();
  status(message);
  if (!queue || queue.complete) return;
  queue.errors++;
  toast(track().title + ' · ' + message);
  const currentQueue = queue;
  setTimeout(() => {
    if (queue === currentQueue && run === active && !currentQueue.complete) advance(active);
  }, 0);
}

async function onBoundary(active) {
  if (run !== active || !active.started || !active.wantsPlay || trimEdit) return;
  active.seekTarget = null;
  active.started = false;
  pause();
  if (!shadow) {
    advance(active);
    return;
  }
  try {
    await startRecording();
    if (!shadow || run !== active) {
      finishRecording();
      return;
    }
    const seconds = Math.max(1, Math.min(120, Number($('gap').value) || 5));
    status('내 차례! ' + seconds + '초 동안 말해 보세요.');
    recTimer = setTimeout(() => {
      finishRecording();
      advance(active);
    }, seconds * 1000);
  } catch (error) {
    stopShadow();
    toast(error.message);
  }
}

function restartRun() {
  run.started = false;
  run.complete = false;
  seek(track().start);
  resume();
}

function advance(active) {
  if (run !== active) return;
  const item = track();
  if (queue) {
    const next = stepTarget(1);
    if (next) {
      queue.index = next.index;
      startTrack(next.id, true);
      return;
    }
    queue.complete = true;
    active.complete = true;
    stopShadow();
    status(queue.errors
      ? '선택 재생 종료 · 재생하지 못한 곡 ' + queue.errors + '개'
      : '선택한 곡을 모두 재생했습니다.');
    syncPlayer();
  } else if (item.repeat === 0 || active.round < item.repeat) {
    active.round++;
    restartRun();
    syncPlayer();
  } else {
    active.complete = true;
    stopShadow();
    status('설정한 반복을 모두 마쳤습니다.');
  }
}

function checkTrimEnd() {
  const active = run;
  if (!active || trimEdit || seekEditing || !active.wantsPlay || !active.started || !isPlaying()) return;
  const item = track();
  const pos = position();
  if (active.seekTarget !== null) {
    const allowance = Math.max(.06, Math.min(.4, ((item.end ?? Infinity) - active.seekTarget) / 2));
    if (Math.abs(pos - active.seekTarget) > allowance && pos >= (item.end ?? Infinity)) return;
    active.seekTarget = null;
  }
  if (active.kind === 'media' && media.seeking) return;
  const length = duration();
  // Let the player signal the natural end, including subsecond clips.
  if (item.end !== null && pos >= item.end) onBoundary(active);
}

function step(direction) {
  const next = stepTarget(direction);
  if (!next) return;
  if (queue) {
    queue.index = next.index;
    queue.complete = false;
  }
  startTrack(next.id, !!queue);
}

$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('toggle').onclick = () => {
  if (!run) return;
  if (queue?.complete) return startQueue(queue.ids);
  if (isPlaying()) {
    pause();
    stopShadow();
  } else if (run.failed) {
    if (queue) queue.errors = Math.max(0, queue.errors - 1);
    startTrack(currentId, !!queue);
  } else if (run.complete || (run.kind === 'media' && media.ended)) {
    run.round = 1;
    restartRun();
    syncPlayer();
  } else {
    resume();
  }
};
$('seek').onpointerdown = () => { seekEditing = true; };
$('seek').oninput = () => {
  stopShadow();
  seek(Number($('seek').value));
};
for (const event of ['change', 'pointerup', 'pointercancel', 'blur']) {
  $('seek').addEventListener(event, () => { seekEditing = false; });
}
$('liveRate').onchange = () => {
  if (!track()) return;
  track().rate = Number($('liveRate').value);
  save();
  applyRate();
  render();
};

function startQueue(ids, startId = ids[0]) {
  const available = ids.filter(id => rows.has(id));
  if (!available.length) return;
  stopShadow();
  const index = Math.max(0, available.indexOf(startId));
  queue = { ids: available, index, complete: false, errors: 0 };
  startTrack(available[index], true);
}

$('selectAll').onchange = () => {
  selected.clear();
  if ($('selectAll').checked) {
    for (const item of group().tracks) selected.add(item.id);
  }
  syncSelection();
};
$('queuePlay').onclick = () => startQueue([...selected]);
$('queueStop').onclick = () => {
  queue = null;
  stopShadow();
  pause();
  status('선택 재생을 중지했습니다.');
  syncPlayer();
};

$('export').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'플로라_플레이리스트.json');$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('파일이 너무 큽니다.');const incoming=validate(JSON.parse(await f.text()));data.groups.push(...incoming.groups);save();switchGroup(incoming.groups[0].id);toast('기존 목록에 플레이리스트를 추가했습니다.')}catch(e){toast('가져오기 실패: '+e.message)}e.target.value=''};
async function permission(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('이 브라우저에서는 녹음을 지원하지 않습니다. 최신 브라우저로 열어 주세요.');try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false})}catch{throw Error('마이크 권한을 허용해야 녹음할 수 있습니다.')}}
async function startRecording(){if(recording)throw Error('현재 녹음을 먼저 중지해 주세요.');if(!stream||!stream.active)await permission();const chunks=[],t=track(),name=t?.title||'내 목소리';const recordGroup=groupId,recordGroupName=group().name;recorder=new MediaRecorder(stream);const activeRecorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:activeRecorder.mimeType||chunks[0]?.type||'audio/webm'}),item={id:uid(),groupId:recordGroup,groupName:recordGroupName,title:name,date:Date.now(),blob};if(blob.size&&db){const tx=db.transaction('recordings','readwrite');tx.objectStore('recordings').put(item);tx.oncomplete=renderRecordings;tx.onerror=()=>toast('녹음을 저장하지 못했어요. 저장 공간을 확인해 주세요.')}else if(blob.size){download(blob,'플로라_녹음.webm')} };recorder.start();recording=true;$('recStatus').textContent='● 내 목소리를 녹음하고 있습니다.';$('manualRec').textContent='녹음 끝내기'}
function finishRecording(){clearTimeout(recTimer);if(recorder?.state==='recording')recorder.stop();recording=false;$('manualRec').textContent='직접 녹음';$('recStatus').textContent='녹음을 마쳤습니다. 아래에서 듣거나 다운로드해 주세요.'}
function releaseMic(){stream?.getTracks().forEach(t=>t.stop());stream=null}
let recordingUrls=[];function renderRecordings(){if(!db)return;const r=db.transaction('recordings').objectStore('recordings').getAll();r.onsuccess=()=>{recordingUrls.forEach(URL.revokeObjectURL);recordingUrls=[];$('recordings').replaceChildren();r.result.filter(x=>x.groupId===groupId).sort((a,b)=>b.date-a.date).forEach(x=>{const row=el('div',undefined,'recording'),audio=document.createElement('audio');audio.controls=true;audio.src=URL.createObjectURL(x.blob);recordingUrls.push(audio.src);const a=el('a','다운로드');a.href=audio.src;a.download=`플로라_녹음_${x.date}.${x.blob.type.includes('mp4')?'m4a':'webm'}`;row.append(el('small',new Date(x.date).toLocaleString('ko-KR')),audio,a,button('삭제',()=>{if(confirm('이 녹음을 삭제할까요?')){const tx=db.transaction('recordings','readwrite');tx.objectStore('recordings').delete(x.id);tx.oncomplete=renderRecordings}}));$('recordings').append(row)})}}

$('addgroup').onclick = () => openGroup();
$('groupEdit').onclick = () => {
  settings.open = false;
  openGroup(group());
};
$('groupForm').onsubmit = event => {
  event.preventDefault();
  const name = event.target.elements.name.value.trim();
  if (!name) return;
  const mode = event.target.elements.mode.value;
  if (editingGroup) {
    stopShadow();
    Object.assign(group(), { name, mode });
    $('shadowPanel').open = false;
  } else {
    const item = { id: uid(), name, mode, tracks: [] };
    data.groups.push(item);
    switchGroup(item.id);
  }
  save();
  render();
  $('groupDialog').close();
};
$('deleteGroup').onclick = () => {
  if (!confirm('이 그룹과 포함된 모든 링크를 삭제할까요? 녹음은 별도로 보관됩니다.')) return;
  data.groups = data.groups.filter(g => g.id !== groupId);
  if (!data.groups.length) data.groups = initial().groups;
  switchGroup(data.groups[0].id);
  save();
  $('groupDialog').close();
};
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { const target=$(b.dataset.close); if(target.tagName==='DIALOG') target.close(); else target.hidden=true; });
settings.addEventListener('click', event => {
  if (event.target.closest('#export, #import')) settings.open = false;
});
document.addEventListener('pointerdown', event => {
  if (settings.open && !settings.contains(event.target)) settings.open = false;
});

function stopShadow() {
  shadow = false;
  clearTimeout(recTimer);
  if (recording) finishRecording();
  releaseMic();
}

$('shadowStart').onclick = async () => {
  const active = run;
  if (!active || active.failed) return toast('먼저 연습할 링크를 재생해 주세요.');
  if (recording) return toast('현재 녹음을 먼저 중지해 주세요.');
  try {
    await permission();
    if (run !== active || group().mode !== 'shadow') {
      releaseMic();
      return;
    }
    queue = null;
    shadow = true;
    active.round = 1;
    restartRun();
    syncPlayer();
    $('recStatus').textContent = '원문을 듣는 중 · 구간이 끝나면 녹음이 시작됩니다.';
  } catch (error) {
    toast(error.message);
  }
};
$('shadowStop').onclick = () => { stopShadow(); pause(); };
$('manualRec').onclick = async () => {
  if (recording) {
    finishRecording();
    releaseMic();
    return;
  }
  stopShadow();
  pause();
  try { await startRecording(); }
  catch (error) { toast(error.message); }
};

function trimTime(n) {
  const tenths = Math.round(Math.max(0, n || 0) * 10);
  return time(tenths / 10) + '.' + tenths % 10;
}

function trimBounds(length) {
  const item = track();
  const gap = Math.min(.1, length);
  const start = Math.min(item.start, length - gap);
  const end = Math.min(length, Math.max(start + gap, item.end ?? length));
  return { start, end, gap };
}

function paintTrim(start, end, length) {
  $('trimStartText').textContent = trimTime(start);
  $('trimEndText').textContent = length || end !== null ? trimTime(end) : '끝';
  $('trimStart').setAttribute('aria-valuetext', trimTime(start));
  $('trimEnd').setAttribute('aria-valuetext', $('trimEndText').textContent);
  $('trimFill').style.left = (length ? start / length * 100 : 0) + '%';
  $('trimFill').style.right = (length ? 100 - end / length * 100 : 0) + '%';
}

let timelineRun;
let timelineLength = -1;
function updateTimeline() {
  const length = duration();
  const pos = position();
  $('clock').textContent = time(pos) + ' / ' + time(length);
  if (!seekEditing) {
    $('seek').max = length || 100;
    $('seek').value = pos;
  }
  $('seek').disabled = !length;
  if (trimEdit || (run === timelineRun && length === timelineLength)) return;
  timelineRun = run;
  timelineLength = length;
  const item = track();
  document.querySelector('.trimbox').hidden = !item;
  for (const id of ['trimStart', 'trimEnd']) {
    $(id).disabled = !length;
    $(id).max = length || 100;
  }
  if (length) {
    const { start, end } = trimBounds(length);
    $('trimStart').value = start;
    $('trimEnd').value = end;
    paintTrim(start, end, length);
  } else if (item) {
    $('trimStart').value = 0;
    $('trimEnd').value = 100;
    paintTrim(item.start, item.end, 0);
  }
}

function beginTrim() {
  if (trimEdit || !duration()) return;
  trimEdit = { active: run, wasPlaying: isPlaying(), changed: false };
  stopShadow();
  pause();
}

function changeTrim(which, value) {
  const length = duration();
  if (!length) return;
  beginTrim();
  const item = track();
  const bounds = trimBounds(length);
  if (which === 'start') bounds.start = Math.max(0, Math.min(Number(value), bounds.end - bounds.gap));
  else bounds.end = Math.min(length, Math.max(Number(value), bounds.start + bounds.gap));
  item.start = Number(bounds.start.toFixed(3));
  item.end = bounds.end >= length - .001 ? null : Number(bounds.end.toFixed(3));
  $('trimStart').value = bounds.start;
  $('trimEnd').value = bounds.end;
  paintTrim(bounds.start, bounds.end, length);
  trimEdit.changed = true;
}

function finishTrim() {
  if (!trimEdit) return;
  const edit = trimEdit;
  trimEdit = null;
  if (edit.active !== run) return;
  if (edit.changed) {
    save();
    run.round = 1;
    run.complete = false;
    seek(track().start);
    const { row } = rows.get(currentId);
    row.querySelector('.meta').textContent = trimTime(track().start) + ' ~ ' + (track().end === null ? '끝' : trimTime(track().end)) + ' · ' + track().rate + '배속';
    if (!edit.wasPlaying) status('구간을 저장했습니다.');
    syncPlayer();
  }
  if (edit.wasPlaying) resume();
}

for (const [id, endpoint] of [['trimStart', 'start'], ['trimEnd', 'end']]) {
  const slider = $(id);
  slider.addEventListener('pointerdown', beginTrim);
  slider.addEventListener('input', () => changeTrim(endpoint, slider.value));
  for (const event of ['change', 'pointerup', 'pointercancel', 'blur']) slider.addEventListener(event, finishTrim);
}

media.addEventListener('timeupdate', checkTrimEnd);
setInterval(() => {
  if (!run) return;
  checkTrimEnd();
  updateTimeline();
}, 60);

window.addEventListener('pagehide', () => {
  if (recording) finishRecording();
  releaseMic();
});
render();
save();
</script>
</body>
</html>
